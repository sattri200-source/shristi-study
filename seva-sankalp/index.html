<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seva Sankalp – Palwal Health Command Centre</title>
<style>
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f172a;color:#e2e8f0}
.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
.card{width:min(520px,92vw);background:#111c33;border:1px solid #263754;border-radius:18px;padding:28px;box-shadow:0 20px 70px #0005;text-align:center}
.spinner{width:42px;height:42px;margin:0 auto 16px;border:4px solid #334155;border-top-color:#2dd4bf;border-radius:50%;animation:s .9s linear infinite}
h1{font-size:20px;margin:0 0 8px}p{margin:0;color:#94a3b8;line-height:1.5}
.err{color:#fda4af;white-space:pre-wrap;text-align:left;margin-top:16px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap"><div class="card"><div class="spinner"></div><h1>Loading Seva Sankalp dashboard</h1><p>Preparing the interactive Palwal Health Command Centre…</p><div id="err" class="err"></div></div></div>
<script>
(async()=>{
  const base='https://raw.githubusercontent.com/sattri200-source/shristi-study/main/seva-sankalp/payload/';
  const files=['part01.txt','part02.txt','part03.txt','part04.txt','part05.txt','part06.txt'];
  const chunks=await Promise.all(files.map(async f=>{
    const r=await fetch(base+f,{cache:'no-store'});
    if(!r.ok) throw new Error('Could not load '+f+' ('+r.status+')');
    return (await r.text()).trim();
  }));
  const b64=chunks.join('');
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  let html;
  if('DecompressionStream' in window){
    const ds=new DecompressionStream('gzip');
    html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
  }else{
    await new Promise((resolve,reject)=>{
      const s=document.createElement('script');
      s.src='https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js';
      s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
    });
    html=new TextDecoder().decode(window.pako.ungzip(bin));
  }
  document.open();
  document.write(html);
  document.close();
})().catch(e=>{
  document.querySelector('.spinner').style.display='none';
  document.querySelector('#err').textContent='Dashboard could not be loaded. '+e.message;
});
</script>
</body>
</html>
